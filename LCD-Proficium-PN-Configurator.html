:root{color:#202327;background:#f6f7f8}
body{background:#f6f7f8;color:#202327}
.wrap{max-width:1200px;padding-top:24px}
.brandbar{background:#111;border-radius:0;min-height:105px;padding:22px 30px;margin-bottom:38px;box-shadow:0 3px 15px #00000014}
.brand-lan,.brand-prof{display:flex;align-items:center;justify-content:center}
.brand-lan img{max-width:360px;background:#fff;padding:9px 14px;max-height:75px;object-fit:contain;width:auto;max-width:100%}
.brand-divider{background:#545454;height:65px}
.brand-prof .proficium-logo{width:100%;max-width:270px;max-height:74px;object-fit:contain;display:block}
.eyebrow{color:#bc2531}
h1{color:#151719;font-weight:750;letter-spacing:-.04em}
p.lead{color:#60666d}
.tabs{border-bottom:1px solid #d8dce1;gap:0;margin-bottom:26px}
.tab{border:0;border-radius:0;background:transparent;color:#61666d;padding:16px 22px;border-bottom:3px solid transparent;font-weight:650}
.tab.active,.tab[aria-selected="true"]{background:transparent;color:#151719;border-bottom-color:#c52732}
.tab:hover{background:#ebedef;color:#1a1a1a}
.output{background:#171a1f;border:0;border-radius:3px;box-shadow:0 8px 24px #00000012;padding:28px}
.small{color:#b9bec6}
.pn{color:#fff}
.copy{background:#d32936;color:white;border-radius:3px}
.copy:hover{background:#af1c27}
.desc{color:#d2d5da;border-top-color:#41454c}
.field{background:#fff;border:1px solid #e1e3e6;border-radius:3px;box-shadow:0 2px 8px #00000007}
.field label{color:#262a2e}
.field select,.field input{background:#fff;color:#222;border:1px solid #cdd1d6;border-radius:3px}
.field select:focus,.field input:focus{border-color:#c52732;box-shadow:0 0 0 2px #c5273225}
.code{color:#b52a33}
.secondary{color:#2e3338;border:1px solid #c8cdd2;border-radius:3px;background:#fff}
.secondary:hover{background:#f0f1f2}
@media(max-width:670px){.brandbar{padding:18px;gap:18px}.brand-divider{height:1px;width:100%}.brand-lan img{max-width:300px}.brand-prof .proficium-logo{max-width:250px}}
:root{--prof-blue:#1470c5;--prof-deep:#122c4b;--prof-light:#eaf3fd}
body{background:#f4f7fb;color:#1d3047}
.brandbar{background:#fff;border-top:5px solid var(--prof-blue);box-shadow:0 5px 24px #143c6514}
.brand-divider{background:#d7e4f0}
.brand-prof .proficium-logo{max-width:330px;max-height:90px}
.eyebrow{color:var(--prof-blue)}
h1{color:var(--prof-deep)}
.tab.active,.tab[aria-selected="true"]{color:var(--prof-deep);border-bottom-color:var(--prof-blue)}
.tab:hover{background:var(--prof-light);color:var(--prof-deep)}
.output{background:linear-gradient(115deg,#102b4c,#194a79);border-top:3px solid var(--prof-blue)}
.copy{background:var(--prof-blue);color:#fff}
.copy:hover{background:#095baf}
.field{border-color:#dce6f1}
.field select:focus,.field input:focus{border-color:var(--prof-blue);box-shadow:0 0 0 2px #1470c529}
.code{color:var(--prof-blue)}
.secondary:hover{background:var(--prof-light)}
.brand-prof .proficium-logo{max-width:460px;max-height:105px;object-fit:contain}
.copy-stack{display:flex;flex-direction:column;gap:8px;min-width:175px}
.copy-stack .copy{width:100%;min-height:40px}
.copy-stack .copy-desc{background:transparent;color:#9ccaff;border:1px solid #4a9af6}
.copy-stack .copy-desc:hover{background:#17395e}
@media(max-width:670px){.copy-stack{width:100%}}

const defaults={network:['CS','10G','S+','3','M','E','SR'],cable:['AOC','CS','6','03M']};
const state={network:[...defaults.network],cable:[...defaults.cable]};let tab='network';
const $=id=>document.getElementById(id);
function fields(){const root=$('fields');root.replaceChildren();DATA[tab].forEach((group,i)=>{const wrap=document.createElement('div');wrap.className='field';const label=document.createElement('label');label.textContent=group.name;label.htmlFor='select-'+i;const sel=document.createElement('select');sel.id='select-'+i;group.items.forEach(item=>{const op=document.createElement('option');op.value=item.code;op.textContent=item.label+'  ['+item.code+']';sel.append(op)});if(tab==='cable'&&i===3){const op=document.createElement('option');op.value='__custom__';op.textContent='Custom length…';sel.append(op)}sel.value=state[tab][i]??group.items[0]?.code??'';if(!sel.value&&sel.options.length)sel.selectedIndex=0;sel.addEventListener('change',()=>{state[tab][i]=sel.value;fields();render()});wrap.append(label,sel);if(tab==='cable'&&i===3&&state.cable[3]==='__custom__'){const custom=document.createElement('input');custom.id='custom-length';custom.placeholder='Enter length code (e.g. 12.5M)';custom.maxLength=12;custom.value=state.cableCustom||'';custom.style.marginTop='10px';custom.addEventListener('input',()=>{state.cableCustom=custom.value.toUpperCase().replace(/[^A-Z0-9.]/g,'');render()});wrap.append(custom)}const code=document.createElement('div');code.className='code';code.id='code-'+i;wrap.append(code);root.append(wrap)});render()}
function codeAt(i){const v=state[tab][i];return v==='__custom__'?(state.cableCustom||''):v||''}
function description(){const pieces=DATA[tab].map((g,i)=>{const x=g.items.find(z=>z.code===state[tab][i]);return x?x.label:tab==='cable'&&i===3?'Custom length '+(state.cableCustom||'(not entered)'):''});if(tab==='network')return `${pieces[0]} compatible | ${pieces[1]} | ${pieces[2]} | ${pieces[3]} | ${pieces[4]} | ${pieces[5]} | ${pieces[6]}`;return `${pieces[0]} | ${pieces[1]} compatible | ${pieces[2]} | ${pieces[3]}`}
function render(){const pn=DATA[tab].map((_,i)=>codeAt(i)).join('');$('pn').textContent=pn||'—';$('desc').textContent=description();$('product-kind').textContent=tab==='network'?'NETWORK TRANSCEIVER':'AOC / DAC CABLE';DATA[tab].forEach((_,i)=>{const el=$('code-'+i);if(el)el.textContent='PN segment: '+(codeAt(i)||'—')})}
function switchTab(next){tab=next;document.querySelectorAll('.tab').forEach(b=>{const active=b.dataset.tab===tab;b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active))});fields()}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
async function copyText(value,btn){const old=btn.textContent;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(value);else{const t=document.createElement('textarea');t.value=value;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();if(!document.execCommand('copy'))throw Error('Copy not supported');t.remove()}btn.textContent='Copied!'}catch(e){btn.textContent='Select & copy';if(btn.id==='copy'){const r=document.createRange();r.selectNodeContents($('pn'));const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r)}}setTimeout(()=>btn.textContent=old,1800)}
$('copy').addEventListener('click',e=>copyText($('pn').textContent,e.currentTarget));$('copy-description').addEventListener('click',e=>copyText($('desc').textContent,e.currentTarget));$('reset').addEventListener('click',()=>{state[tab]=[...defaults[tab]];if(tab==='cable')state.cableCustom='';fields()});switchTab('network');
</script></body></html>
